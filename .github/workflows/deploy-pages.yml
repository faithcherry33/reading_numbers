name: Deploy reading_numbers

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v6

      - name: 배포 파일 만들기
        run: |
          mkdir -p _site

          # CSS는 개별 이름 대신 *.css로 한꺼번에 복사합니다.
          # 이전에는 battle-final.css가 목록에서 빠져 있어 사이트에
          # 올라가지 않았고, 그래서 화면 정렬이 전부 깨져 있었습니다.
          cp index.html app.js *.css _site/

          cat > _site/firebase-config.js <<'EOF'
          export const firebaseConfig = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}"
          };

          export const isFirebaseConfigured = Object.values(
            firebaseConfig
          ).every(
            (value) => value && !String(value).includes("YOUR_")
          );
          EOF

      - name: 배포 파일 확인
        run: |
          echo "배포될 파일 목록:"
          ls -la _site
          # 필수 파일이 빠지면 배포를 중단하고 알려 줍니다.
          for f in index.html app.js style.css battle-final.css firebase-config.js; do
            if [ ! -f "_site/$f" ]; then
              echo "::error::_site/$f 이(가) 없습니다. 배포를 중단합니다."
              exit 1
            fi
          done
          echo "필수 파일 모두 확인되었습니다."

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5

      - name: 배포 파일 업로드
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
